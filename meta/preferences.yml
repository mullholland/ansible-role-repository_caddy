---
# This file is used by ansible-generator.

# CentOS isn't a valid Galaxy platform name (only "EL" is), but the role
# supports it via the same COPR-based path used for RedHat/Rocky/AlmaLinux/
# Fedora, so it's added to the CI matrix and README compatibility table
# here instead.
extra_platforms:
  - name: CentOS
    versions:
      - all
